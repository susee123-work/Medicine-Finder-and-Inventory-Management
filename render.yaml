services:
  # Option 1: Unified Full-Stack Web Service (FastAPI + Vite React SPA)
  - type: web
    name: medipulse-ai
    runtime: python
    buildCommand: ./build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.18.0
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: USE_LOCAL_DB
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_NAME
        value: MediPulse AI
      - key: SMTP_USE_TLS
        value: "true"
      - key: EMAIL_WEBHOOK_URL
        sync: false
